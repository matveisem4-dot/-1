<!DOCTYPE html>
<html>
<head>
    <title>I.S.-1 Messenger</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <style>
        body { background: #0e1621; color: white; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 300px; background: #17212b; border-right: 1px solid #000; padding: 20px; }
        #chat { flex: 1; display: flex; flex-direction: column; background: url('https://i.imgur.com/8N7jRXP.png'); }
        .msg-container { flex: 1; padding: 20px; overflow-y: auto; }
        .bubble { background: #182533; padding: 10px 15px; border-radius: 15px; margin: 5px; max-width: 70%; align-self: flex-start; }
        .my-msg { background: #2b5278; align-self: flex-end; }
        input { background: #242f3d; border: none; color: white; padding: 15px; border-radius: 10px; width: 90%; margin: 10px; }
        button { background: #40a7e3; border: none; color: white; padding: 10px; border-radius: 5px; cursor: pointer; }
        #call-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; text-align: center; padding-top: 20%; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>I.S.-1 CORE</h3>
        <input id="userId" placeholder="Your ID">
        <input id="pass" type="password" placeholder="Password">
        <input id="email" placeholder="Email (optional 2FA)">
        <button onclick="auth()">LOGIN / REG</button>
        <hr>
        <input id="targetId" placeholder="Target ID">
        <button onclick="startCall()" style="background: #4caf50;">CALL P2P</button>
    </div>
    <div id="chat">
        <div id="msgs" class="msg-container"></div>
        <div style="display: flex;">
            <input id="msgText" placeholder="Write a message...">
            <button onclick="sendMsg()">SEND</button>
        </div>
    </div>

    <div id="call-overlay">
        <h2>INCOMING CALL...</h2>
        <button onclick="acceptCall()">ACCEPT</button>
    </div>

    <script>
        const socket = io('https://твой-адрес-с-гитхаба.com');
        let myId, peer;

        function auth() {
            myId = document.getElementById('userId').value;
            socket.emit('auth', { id: myId, password: document.getElementById('pass').value, email: document.getElementById('email').value });
        }

        function sendMsg() {
            const to = document.getElementById('targetId').value;
            const text = document.getElementById('msgText').value;
            socket.emit('msg', { to, text });
            document.getElementById('msgs').innerHTML += `<div class="bubble my-msg">${text}</div>`;
        }

        socket.on('msg', data => {
            document.getElementById('msgs').innerHTML += `<div class="bubble">${data.from}: ${data.text}</div>`;
            if (Notification.permission === "granted") new Notification("New Msg from " + data.from);
        });

        // P2P ЛОГИКА
        function startCall() {
            const to = document.getElementById('targetId').value;
            peer = new SimplePeer({ initiator: true, trickle: false });
            peer.on('signal', signal => socket.emit('call_signal', { to, signal }));
            setupPeerEvents();
        }

        socket.on('call_signal', data => {
            if (!peer) {
                document.getElementById('call-overlay').style.display = 'block';
                window.incomingSignal = data.signal;
                window.caller = data.from;
            } else {
                peer.signal(data.signal);
            }
        });

        function acceptCall() {
            peer = new SimplePeer({ initiator: false, trickle: false });
            peer.on('signal', signal => socket.emit('call_signal', { to: window.caller, signal }));
            peer.signal(window.incomingSignal);
            setupPeerEvents();
            document.getElementById('call-overlay').style.display = 'none';
        }

        function setupPeerEvents() {
            peer.on('connect', () => console.log('P2P CONNECTED - SERVER CAN REBOOT NOW'));
            peer.on('stream', stream => { /* Тут вывод видео/аудио */ });
        }

        Notification.requestPermission();
    </script>
</body>
</html>
