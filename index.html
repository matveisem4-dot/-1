<!DOCTYPE html>
<style>
    :root { --bg: #0e1621; --tg-blue: #2b5278; --text: #fff; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
    #side { width: 300px; background: #17212b; border-right: 1px solid #000; padding: 15px; }
    #main { flex: 1; display: flex; flex-direction: column; background: #0e1621; }
    .bubble { background: var(--tg-blue); padding: 10px; border-radius: 12px; margin: 5px; max-width: 80%; }
    input { background: #242f3d; border: none; color: #fff; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px; }
    button { background: #40a7e3; border: none; color: #fff; padding: 10px; cursor: pointer; width: 100%; border-radius: 5px; }
    #call-ui { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 99; text-align: center; }
</style>

<div id="side">
    <h2 style="color: #40a7e3">I.S.-1 CORE</h2>
    <input id="u" placeholder="ID">
    <input id="p" type="password" placeholder="Password">
    <button onclick="auth()">CONNECT</button>
    <hr>
    <input id="t" placeholder="Target ID">
    <button onclick="call()" style="background: #4caf50">P2P CALL</button>
</div>
<div id="main">
    <div id="box" style="flex: 1; padding: 20px; overflow-y: auto;"></div>
    <div style="padding: 15px; background: #17212b;">
        <input id="m" placeholder="Write a message..." onkeypress="if(event.key=='Enter')send()">
    </div>
</div>

<div id="call-ui">
    <h1 id="call-status">INCOMING CALL...</h1>
    <button onclick="ans()">ANSWER</button>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
<script>
    let socket = io('https://ТВОЙ-ГИТХАБ-URL.loca.lt'); // Юзай localtunnel или постоянный IP
    let me, peer;

    function auth() {
        me = document.getElementById('u').value;
        socket.emit('auth', { id: me, password: document.getElementById('p').value });
    }

    function send() {
        let to = document.getElementById('t').value;
        let text = document.getElementById('m').value;
        socket.emit('msg', { to, from: me, text });
        document.getElementById('box').innerHTML += `<div class="bubble" style="margin-left: auto">${text}</div>`;
    }

    socket.on('msg', d => {
        document.getElementById('box').innerHTML += `<div class="bubble">${d.from}: ${d.text}</div>`;
        new Notification("IS1: " + d.from, { body: d.text });
    });

    // P2P ЛОГИКА (БЕСШОВНАЯ)
    function call() {
        peer = new SimplePeer({ initiator: true, trickle: false });
        peer.on('signal', signal => socket.emit('signal', { to: document.getElementById('t').value, from: me, signal }));
        setupPeer();
    }

    socket.on('signal', d => {
        if (!peer) {
            document.getElementById('call-ui').style.display = 'block';
            window.inc = d.signal; window.caller = d.from;
        } else peer.signal(d.signal);
    });

    function ans() {
        peer = new SimplePeer({ initiator: false, trickle: false });
        peer.on('signal', s => socket.emit('signal', { to: window.caller, from: me, signal: s }));
        peer.signal(window.inc);
        setupPeer();
        document.getElementById('call-ui').style.display = 'none';
    }

    function setupPeer() {
        peer.on('connect', () => {
            document.getElementById('call-status').innerText = "P2P ACTIVE (ENCRYPTED)";
            console.log("SERVER CAN DIE NOW, CALL IS P2P");
        });
    }
    Notification.requestPermission();
</script>
