<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #0e1621; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background-color: #17212b; padding: 30px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background-color: #242f3d; color: white; outline: none; }
        .check-container { display: flex; align-items: center; justify-content: start; font-size: 13px; margin: 10px 0; color: #8ab4f8; }
        button { width: 100%; padding: 12px; background-color: #2ba3d1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #33b5e5; }
        h2 { margin-bottom: 20px; color: #fff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Регистрация</h2>
        <input type="text" id="user_id" placeholder="Придумайте ID (ник)">
        <input type="password" id="password" placeholder="Придумайте пароль">
        
        <div class="check-container">
            <input type="checkbox" id="use_2fa" style="width: 20px; margin: 0 10px 0 0;" onchange="toggleEmail()">
            <span>Включить 2FA (Email)</span>
        </div>
        
        <input type="email" id="email" placeholder="Ваш Email" style="display: none;">
        
        <button onclick="submitData()">СОЗДАТЬ АККАУНТ</button>
    </div>

    <script>
        function toggleEmail() {
            const emailInput = document.getElementById('email');
            emailInput.style.display = document.getElementById('use_2fa').checked ? 'block' : 'none';
        }

        function submitData() {
            const data = {
                id: document.getElementById('user_id').value,
                pass: document.getElementById('password').value,
                use2fa: document.getElementById('use_2fa').checked,
                email: document.getElementById('email').value
            };
            // Передаем объект в Python
            window.py_bridge.register_user(JSON.stringify(data));
        }
    </script>
</body>
</html>
