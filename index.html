<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #0e1621; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #17212b; padding: 15px; font-weight: bold; border-bottom: 1px solid #000; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { background: #182533; padding: 10px; border-radius: 10px; margin-bottom: 10px; max-width: 80%; }
        .my-msg { background: #2b5278; align-self: flex-end; }
        .input-area { background: #17212b; padding: 15px; display: flex; }
        input { flex: 1; background: #242f3d; border: none; padding: 12px; color: white; border-radius: 8px; outline: none; }
        button { background: #2ba3d1; border: none; color: white; padding: 0 20px; margin-left: 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header" id="status">ShadowGram: Ожидание подключения...</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="inp" placeholder="Напишите сообщение...">
        <button onclick="send()">ОТПРАВИТЬ</button>
    </div>

    <script>
        function addMsg(text, isMy) {
            const div = document.createElement('div');
            div.className = 'msg' + (isMy ? ' my-msg' : '');
            div.innerText = text;
            document.getElementById('chat').appendChild(div);
        }

        function send() {
            const val = document.getElementById('inp').value;
            if(!val) return;
            addMsg(val, true);
            window.py_bridge.send_to_python(val); // Отправка в Python-движок
            document.getElementById('inp').value = "";
        }
        
        // Функция, которую будет вызывать Python при получении сообщения
        function receiveMsg(text) { addMsg(text, false); }
        function setStatus(text) { document.getElementById('status').innerText = text; }
    </script>
</body>
</html>
