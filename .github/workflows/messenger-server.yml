name: Eternal Messenger Server (Windows)

on:
  schedule:
    - cron: '0 */4 * * *' # Автоматический перезапуск каждые 4 часа
  workflow_dispatch:      # Ручной запуск

jobs:
  run-server:
    runs-on: windows-latest # Используем Windows для записи на диск C:\

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install firebase-admin

      - name: Create Firebase Key File
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json
        shell: bash

      - name: Run Server
        run: node server.js
        # GitHub Action прервет выполнение через 6 часов (лимит), 
        # но наш cron запустит новую сессию каждые 4 часа.
