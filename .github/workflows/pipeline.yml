name: IS1_ULTIMATE_PIPELINE

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  # СОБИРАЕМ EXE ДЛЯ ВИНДЫ (На виндовом движке)
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build EXE
        run: |
          npm install
          npm run build-win
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: dist/*.exe

  # СОБИРАЕМ APK ДЛЯ АНДРОИДА (На линуксе)
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build APK
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap add android
          # ВАЖНО: Гитхаб соберет только если есть папка android/
          # Если её нет, надо сначала запустить npx cap init
          npx cap build android --androidreleasetype apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  # ТВОЙ ВЕЧНЫЙ СЕРВЕР (Оставляем на винде ради диска C)
  run-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Messaging Core
        env:
          DB_SECRET_KEY: ${{ secrets.DB_SECRET_KEY }}
        run: |
          npm install express socket.io bcrypt crypto
          node server.js
